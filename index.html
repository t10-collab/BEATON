<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🥁 4/4박자 리듬 메이커</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🥁 두근두근 드럼 기초</h1>
            <p>음표를 선택하고 슬롯을 클릭하여 리듬을 완성하세요!</p>
        </header>

        <div class="note-selector">
            <button class="note-btn active" data-type="4n">♩ (4분)</button>
            <button class="note-btn" data-type="4n.">♩. (점4분)</button>
            <button class="note-btn" data-type="8n">♪ (8분)</button>
        </div>

        <div class="instrument-pad">
            <button class="pad k" id="kickPad">KICK (쿵)</button>
            <button class="pad s" id="snarePad">SNARE (팍)</button>
            <button class="pad h" id="hihatPad">HI-HAT (칫)</button>
        </div>

        <div class="sequencer-board">
            <div class="slots-container" id="slotsContainer">
                </div>
        </div>

        <div class="controls">
            <button id="playBtn" class="primary-btn">▶️ 재생하기</button>
            <button id="resetBtn">🔄 초기화</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
