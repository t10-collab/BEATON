<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎛️ Pro Rhythm Studio v1.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="studio-container">
        <header class="studio-header">
            <div class="logo-zone">
                <span class="live-indicator">● LIVE</span>
                <h1>PRO RHYTHM STUDIO</h1>
            </div>
            <div class="tempo-console">
                <div class="console-label">TEMPO CONTROL</div>
                <div class="slider-box">
                    <span>70</span>
                    <input type="range" id="bpm-slider" min="70" max="120" value="88">
                    <span>120</span>
                </div>
                <div class="bpm-display">BPM <span id="bpm-value">88</span></div>
            </div>
        </header>

        <section class="monitor-section">
            <div class="status-bar">
                <div class="status-item">박자 게이지: <span id="remaining-beats">4.0</span> / 4.0 BEATS</div>
                <div class="progress-track" id="progress-track">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>
            
            <div class="master-track">
                <div class="track-label">MASTER RHYTHM</div>
                <div id="rhythm-sequence" class="sequence-display">
                    </div>
            </div>
        </section>

        <section class="palette-section">
            <h3 class="section-title">RHYTHM COMPONENTS</h3>
            <div class="note-palette">
                <button class="note-card c-4n" data-type="4" data-len="1">
                    <div class="note-symbol">♩</div>
                    <div class="note-name">4분음표</div>
                    <div class="note-meta">1.0 Beat</div>
                </button>
                <button class="note-card c-4r" data-type="4r" data-len="1">
                    <div class="note-symbol">𝄽</div>
                    <div class="note-name">4분쉼표</div>
                    <div class="note-meta">1.0 Beat</div>
                </button>
                <button class="note-card c-8r" data-type="8r" data-len="0.5">
                    <div class="note-symbol">𝄾</div>
                    <div class="note-name">8분쉼표</div>
                    <div class="note-meta">0.5 Beat</div>
                </button>
                <button class="note-card c-8-8" data-type="8-8" data-len="1">
                    <div class="note-symbol">♫</div>
                    <div class="note-name">8분 2개</div>
                    <div class="note-meta">1.0 Beat</div>
                </button>
                <button class="note-card c-16-16" data-type="16-16" data-len="0.5">
                    <div class="note-symbol">♬</div>
                    <div class="note-name">16분 2개</div>
                    <div class="note-meta">0.5 Beat</div>
                </button>
            </div>
        </section>

        <footer class="studio-footer">
            <button id="playBtn" class="ctrl-btn btn-play">▶ PLAY RHYTHM</button>
            <button id="undoBtn" class="ctrl-btn btn-undo">↩ Undo (되돌리기)</button>
            <button id="resetBtn" class="ctrl-btn btn-reset">🔄 RESET ALL</button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
