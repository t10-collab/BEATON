<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥁 2마디 리듬 창작실</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🎶 2마디 리듬 창작 수업</h1>
            <div class="tempo-control">
                <label for="bpm">Tempo: <span id="bpm-val">88</span> BPM</label>
                <input type="range" id="bpm" min="60" max="140" value="88">
            </div>
        </header>

        <section class="note-palette">
            <h3>음표 선택 (클릭 후 슬롯 선택)</h3>
            <div class="note-btns">
                <button class="note-item" data-type="4n" data-len="4">♩ (4분)</button>
                <button class="note-item" data-type="4r" data-len="4">𝄽 (4쉼)</button>
                <button class="note-item" data-type="8n2" data-len="4">♫ (8분×2)</button>
                <button class="note-item" data-type="8n1" data-len="2">♪ (8분×1)</button>
                <button class="note-item" data-type="8r" data-len="2">𝄾 (8쉼)</button>
                <button class="note-item" data-type="16n4" data-len="4">♬ (16분×4)</button>
            </div>
        </section>

        <section class="composition-area">
            <h3>나만의 리듬 마디 (총 2마디)</h3>
            <div class="measure-label">1마디</div>
            <div class="grid" id="grid-m1"></div>
            <div class="measure-label">2마디</div>
            <div class="grid" id="grid-m2"></div>
        </section>

        <div class="controls">
            <button id="play-btn" class="main-btn">▶️ 리듬 연주하기</button>
            <button id="reset-btn">🔄 전부 지우기</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
