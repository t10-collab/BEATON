<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🥁 리듬 메이커 - 중2 음악</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-window">
        <header>
            <h1>🥁 4/4박자 리듬 스튜디오</h1>
            <div class="status-bar">남은 박자: <span id="remaining-beats">8</span> / 8 (8분음표 기준)</div>
        </header>

        <div class="selection-area">
            <div class="note-picker">
                <button class="note-btn active" data-len="2">♩ (4분)</button>
                <button class="note-btn" data-len="3">♩. (점4분)</button>
                <button class="note-btn" data-len="1">♪ (8분)</button>
            </div>
            <div class="instrument-picker">
                <button class="inst-btn k active" data-inst="kick">KICK (쿵)</button>
                <button class="inst-btn s" data-inst="snare">SNARE (팍)</button>
                <button class="inst-btn h" data-inst="hihat">HI-HAT (칫)</button>
            </div>
        </div>

        <div class="grid-container" id="grid">
            </div>

        <div class="action-buttons">
            <button id="play-btn" class="btn-primary">▶️ 리듬 연주</button>
            <button id="reset-btn" class="btn-secondary">🔄 다시 만들기</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
