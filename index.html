<!-- index.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>4/4 리듬 메이커</title>

  <link rel="stylesheet" href="style.css"/>

  <!-- Tone.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
</head>
<body>

  <div class="app">

    <header>
      <h1>🥁 RHYTHM MAKER</h1>
      <p>4/4박자 리듬 창작 스튜디오</p>
    </header>

    <section class="tempo-section">
      <label>🎧 BPM : <span id="bpmValue">88</span></label>
      <input type="range" id="tempo" min="50" max="160" value="88"/>
    </section>

    <section class="toolbar">

      <button class="note-btn" data-type="quarter">
        ♩<br>
        <span>4분음표</span>
      </button>

      <button class="note-btn" data-type="quarterRest">
        𝄽<br>
        <span>4분쉼표</span>
      </button>

      <button class="note-btn" data-type="eighthRest">
        𝄾<br>
        <span>8분쉼표</span>
      </button>

      <button class="note-btn" data-type="eighthPair">
        ♪♪<br>
        <span>8분음표2개</span>
      </button>

      <button class="note-btn" data-type="sixteenthPair">
        ♬<br>
        <span>16분음표2개</span>
      </button>

    </section>

    <section class="measure-wrap">

      <div class="measure-info">
        <span>현재 박자</span>
        <span id="beatDisplay">0 / 4</span>
      </div>

      <div id="measure" class="measure"></div>

    </section>

    <section class="controls">
      <button id="playBtn" class="main-btn play">
        ▶ 리듬 연주하기
      </button>

      <button id="undoBtn" class="main-btn undo">
        ↶ Undo
      </button>

      <button id="clearBtn" class="main-btn clear">
        ✖ 전체삭제
      </button>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
