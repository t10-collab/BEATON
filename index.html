<!-- index.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHYTHM MAKER</title>

  <link rel="stylesheet" href="style.css">

  <!-- Tone.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
</head>

<body>

  <div class="app">

    <!-- 제목 -->
    <header>

      <div class="logo">
        🥁
      </div>

      <div>
        <h1>RHYTHM MAKER</h1>
        <p>4/4박자 리듬 창작 스튜디오</p>
      </div>

    </header>

    <!-- BPM -->
    <section class="top-section">

      <div class="bpm-box">

        <label>BPM</label>

        <div class="bpm-number" id="bpmValue">
          88
        </div>

        <input
          type="range"
          id="tempo"
          min="50"
          max="160"
          value="88"
        >

      </div>

      <div class="beat-status">

        <span>현재 박자</span>

        <h2 id="beatDisplay">
          0 / 4
        </h2>

      </div>

    </section>

    <!-- 음표 버튼 -->
    <section class="toolbar">

      <button class="note-btn purple" data-type="quarter">
        ♩
        <span>4분음표</span>
      </button>

      <button class="note-btn blue" data-type="quarterRest">
        𝄽
        <span>4분쉼표</span>
      </button>

      <button class="note-btn cyan" data-type="eighthRest">
        𝄾
        <span>8분쉼표</span>
      </button>

      <button class="note-btn green" data-type="eighthSingle">
        ♪
        <span>8분음표 1개</span>
      </button>

      <button class="note-btn yellow" data-type="eighthPair">
        ♪♪
        <span>8분음표 2개</span>
      </button>

      <button class="note-btn pink" data-type="sixteenthPair">
        ♬
        <span>16분음표 2개</span>
      </button>

    </section>

    <!-- 리듬 영역 -->
    <section class="timeline-wrap">

      <!-- 박자 표시 -->
      <div class="timeline-top">

        <div>1박</div>
        <div>2박</div>
        <div>3박</div>
        <div>4박</div>

      </div>

      <!-- 실제 마디 -->
      <div class="timeline">

        <!-- 4/4 -->
        <div class="time-signature">
          4<br>4
        </div>

        <!-- 리듬 -->
        <div id="measure" class="measure">

          <!-- 재생선 -->
          <div id="playhead"></div>

        </div>

      </div>

    </section>

    <!-- 버튼 -->
    <section class="controls">

      <button id="playBtn" class="main-btn play">
        ▶ 재생하기
      </button>

      <button id="undoBtn" class="main-btn undo">
        ↶ Undo
      </button>

      <button id="clearBtn" class="main-btn clear">
        ✖ 전체삭제
      </button>

    </section>

  </div>

  <script src="script.js"></script>

</body>
</html>
