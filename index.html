<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥁 리듬 창작소 (Tempo 88)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎶 4/4박자 리듬 창작 도구</h1>
            <div class="tempo-info">현재 속도: ♩ = 88</div>
        </header>

        <div class="note-palette">
            <button class="note-item" data-type="4" data-beats="1">
                <div class="note-img">♩</div>
                <span>4분음표</span>
            </button>
            <button class="note-item" data-type="4r" data-beats="1">
                <div class="note-img">𝄽</div>
                <span>4분쉼표</span>
            </button>
            <button class="note-item" data-type="8-8" data-beats="1">
                <div class="note-img">♫</div>
                <span>8분음표 2개</span>
            </button>
            <button class="note-item" data-type="8" data-beats="0.5">
                <div class="note-img">♪</div>
                <span>8분음표 1개</span>
            </button>
            <button class="note-item" data-type="8r" data-beats="0.5">
                <div class="note-img">𝄾</div>
                <span>8분쉼표</span>
            </button>
            <button class="note-item" data-type="16" data-beats="1">
                <div class="note-img">♬</div>
                <span>16분음표 4개</span>
            </button>
        </div>

        <div class="workspace-section">
            <div class="beat-counter">박자 충전: <span id="current-beats">0</span> / 4 박</div>
            <div id="rhythm-board" class="rhythm-board">
                </div>
        </div>

        <div class="controls">
            <button id="playBtn" class="btn play">▶️ 리듬 연주하기</button>
            <button id="resetBtn" class="btn reset">🔄 다시 만들기</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
